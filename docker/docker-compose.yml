# ============================================================
# Voxly — Docker Compose
# Twenty CRM (multi-workspace) + Control Plane + Bot Workers
# ============================================================

# Per-service auth tokens (9.2). Each defaults empty → services fall back to
# the shared VOXLY_SERVICE_TOKEN, so existing single-token setups keep working.
# Set only the ones you want to rotate independently when splitting to separate
# hosts. Keyed by the TARGET service that verifies inbound calls.
x-voxly-service-tokens: &voxly-service-tokens
  VOXLY_TOKEN_SAAS_API: ${VOXLY_TOKEN_SAAS_API:-}
  VOXLY_TOKEN_GRAMJS_BRIDGE: ${VOXLY_TOKEN_GRAMJS_BRIDGE:-}
  VOXLY_TOKEN_MAX_BRIDGE: ${VOXLY_TOKEN_MAX_BRIDGE:-}
  VOXLY_TOKEN_AI_TELEGRAM_WORKER: ${VOXLY_TOKEN_AI_TELEGRAM_WORKER:-}
  VOXLY_TOKEN_AI_WHATSAPP_WORKER: ${VOXLY_TOKEN_AI_WHATSAPP_WORKER:-}
  VOXLY_TOKEN_PLATFORM_BOT: ${VOXLY_TOKEN_PLATFORM_BOT:-}

services:
  # --- Reverse Proxy (wildcard SSL for *.getvoxly.ru) ---
  traefik:
    image: traefik:v3.1
    restart: unless-stopped
    command:
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      # Entry points
      - "--entryPoints.web.address=:80"
      - "--entryPoints.websecure.address=:443"
      # HTTP -> HTTPS redirect
      - "--entryPoints.web.http.redirections.entryPoint.to=websecure"
      - "--entryPoints.web.http.redirections.entryPoint.scheme=https"
      # Let's Encrypt resolver (wildcard via DNS challenge)
      # Uncomment and configure for production
      # - "--certificatesresolvers.le.acme.dnschallenge=true"
      # - "--certificatesresolvers.le.acme.dnschallenge.provider=cloudflare"
      # - "--certificatesresolvers.le.acme.email=admin@getvoxly.ru"
      # - "--certificatesresolvers.le.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"  # Dashboard (restrict in prod)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik-dynamic.yml:/etc/traefik/dynamic/dynamic.yml:ro
      - traefik-letsencrypt:/letsencrypt
    networks:
      - voxly-net

  # --- PostgreSQL for Control Plane ---
  postgres-control:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: voxly
      POSTGRES_PASSWORD: ${POSTGRES_CONTROL_PASSWORD:-voxly_pass}
      POSTGRES_DB: voxly_control
    ports:
      - "5433:5432"
    volumes:
      - postgres-control-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voxly -d voxly_control"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - voxly-net

  # --- PostgreSQL for Twenty CRM ---
  postgres-twenty:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: twenty
      POSTGRES_PASSWORD: ${POSTGRES_TWENTY_PASSWORD:-twenty_pass}
      POSTGRES_DB: twenty
    ports:
      - "5434:5432"
    volumes:
      - postgres-twenty-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U twenty -d twenty"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - voxly-net

  # --- Redis (BullMQ queues, sessions, caching) ---
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 1gb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - voxly-net

  # --- Twenty CRM Server (multi-workspace) ---
  twenty-server:
    image: voxly-twenty:2.22.0
    build:
      context: ..
      dockerfile: docker/twenty.Dockerfile
      args:
        VOXLY_CABINET_URL: ${VOXLY_CABINET_URL:-https://getvoxly.ru/dashboard}
        VOXLY_API_URL: ${VOXLY_API_URL:-https://api.getvoxly.ru}
    restart: unless-stopped
    depends_on:
      postgres-twenty:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Multi-workspace mode (required for SaaS)
      IS_MULTIWORKSPACE_ENABLED: "true"
      IS_WORKSPACE_CREATION_LIMITED_TO_SERVER_ADMINS: "false"
      DEFAULT_SUBDOMAIN: "app"
      # Database
      PG_DATABASE_URL: postgresql://twenty:${POSTGRES_TWENTY_PASSWORD:-twenty_pass}@postgres-twenty:5432/twenty
      # Redis
      REDIS_URL: redis://redis:6379
      SERVER_URL: ${TWENTY_SERVER_URL:-https://app.getvoxly.ru}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      # Auth
      AUTH_JWT_SECRET: ${TWENTY_JWT_SECRET:-change-twenty-jwt-secret}
      # Apps SDK logic functions (production default is DISABLED)
      LOGIC_FUNCTION_TYPE: ${LOGIC_FUNCTION_TYPE:-LOCAL}
      # Injected into LOCAL logic functions (voxly-crm-chat → saas-api)
      VOXLY_SERVICE_TOKEN: ${VOXLY_SERVICE_TOKEN:-}
      <<: *voxly-service-tokens
      VOXLY_API_URL: ${VOXLY_API_URL:-http://saas-api:3002}
      # API
      API_BASE_PATH: "/rest"
      # Email (SMTP for invites)
      EMAIL_SYSTEM_ADDRESS: noreply@getvoxly.ru
      MAILER_SMTP_HOST: ${SMTP_HOST}
      MAILER_SMTP_PORT: ${SMTP_PORT}
      MAILER_SMTP_USER: ${SMTP_USER}
      MAILER_SMTP_PASSWORD: ${SMTP_PASS}
      MAILER_SMTP_SECURE: "false"
      # Frontend URL (used for email links)
      FRONT_BASE_URL: https://app.getvoxly.ru
      # Disable signup if managed by control plane
      IS_SIGN_UP_DISABLED: "false"
    volumes:
      # Front-component + logic-function bundles (wiped on recreate without this — INC-029)
      - twenty-storage:/app/packages/twenty-server/.local-storage
    labels:
      - "traefik.enable=true"
      # Dashboard / API on app.getvoxly.ru (default subdomain)
      - "traefik.http.routers.twenty-app.rule=Host(`app.getvoxly.ru`)"
      - "traefik.http.routers.twenty-app.entrypoints=websecure"
      # - "traefik.http.routers.twenty-app.tls.certresolver=le"
      - "traefik.http.routers.twenty-app.service=twenty-server"
      - "traefik.http.services.twenty-server.loadbalancer.server.port=3000"
      # Wildcard for workspace subdomains: *.getvoxly.ru (but NOT the portal slugs)
      # Traefik will route via dynamic config priority
      - "traefik.http.routers.twenty-wildcard.rule=HostRegexp(`{subdomain:[a-z0-9-]+}-crm.getvoxly.ru`)"
      - "traefik.http.routers.twenty-wildcard.entrypoints=websecure"
      # - "traefik.http.routers.twenty-wildcard.tls.certresolver=le"
      - "traefik.http.routers.twenty-wildcard.service=twenty-server"
    networks:
      - voxly-net

  # --- Twenty background worker ---
  twenty-worker:
    image: voxly-twenty:2.22.0
    restart: unless-stopped
    command: ["yarn", "worker:prod"]
    depends_on:
      postgres-twenty:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PG_DATABASE_URL: postgresql://twenty:${POSTGRES_TWENTY_PASSWORD:-twenty_pass}@postgres-twenty:5432/twenty
      REDIS_URL: redis://redis:6379
      SERVER_URL: ${TWENTY_SERVER_URL:-https://app.getvoxly.ru}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      LOGIC_FUNCTION_TYPE: ${LOGIC_FUNCTION_TYPE:-LOCAL}
      VOXLY_SERVICE_TOKEN: ${VOXLY_SERVICE_TOKEN:-}
      <<: *voxly-service-tokens
      VOXLY_API_URL: ${VOXLY_API_URL:-http://saas-api:3002}
    volumes:
      - twenty-storage:/app/packages/twenty-server/.local-storage
    networks:
      - voxly-net

  # --- Control Plane API (Node.js + Fastify) ---
  saas-api:
    build:
      context: ..
      dockerfile: apps/saas-api/Dockerfile
      args:
        VOXLY_CABINET_URL: ${VOXLY_CABINET_URL:-https://getvoxly.ru/dashboard}
    restart: unless-stopped
    depends_on:
      postgres-control:
        condition: service_healthy
      postgres-twenty:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      VOXLY_DISABLE_WORKERS: ${VOXLY_DISABLE_WORKERS:-1}
      DATABASE_URL: postgresql://voxly:${POSTGRES_CONTROL_PASSWORD:-voxly_pass}@postgres-control:5432/voxly_control?schema=public
      REDIS_URL: redis://redis:6379
      TWENTY_API_URL: http://twenty-server:3000/graphql
      TWENTY_API_KEY: ${TWENTY_API_KEY}
      TWENTY_SERVER_URL: ${TWENTY_SERVER_URL:-https://app.getvoxly.ru}
      TWENTY_DATABASE_URL: postgresql://twenty:${POSTGRES_TWENTY_PASSWORD:-twenty_pass}@postgres-twenty:5432/twenty
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      ROBOKASSA_LOGIN: ${ROBOKASSA_LOGIN}
      ROBOKASSA_PASSWORD1: ${ROBOKASSA_PASSWORD1}
      ROBOKASSA_PASSWORD2: ${ROBOKASSA_PASSWORD2}
      ROBOKASSA_IS_TEST: ${ROBOKASSA_IS_TEST:-1}
      ROBOKASSA_HASH_ALG: ${ROBOKASSA_HASH_ALG:-sha256}
      TELEGRAM_MANAGER_BOT_TOKEN: ${TELEGRAM_MANAGER_BOT_TOKEN}
      TELEGRAM_MANAGER_BOT_USERNAME: ${TELEGRAM_MANAGER_BOT_USERNAME:-VoxlyGiftbot}
      PLATFORM_BOT_TOKEN: ${PLATFORM_BOT_TOKEN:-}
      PLATFORM_BOT_USERNAME: ${PLATFORM_BOT_USERNAME:-GetVoxlybot}
      VOXLY_DOMAIN: ${VOXLY_DOMAIN:-getvoxly.ru}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM:-}
      AI_MARKUP_PERCENT: ${AI_MARKUP_PERCENT:-50}
      AI_TOPUP_MIN_RUB: ${AI_TOPUP_MIN_RUB:-500}
      VOXLY_SERVICE_TOKEN: ${VOXLY_SERVICE_TOKEN:-}
      <<: *voxly-service-tokens
      VOXLY_CHAT_API_URL: ${VOXLY_CHAT_API_URL:-http://saas-api:3002}
      VOXLY_CRM_CHAT_TARBALL: ${VOXLY_CRM_CHAT_TARBALL:-/voxly/assets/voxly-crm-chat.tgz}
      # Internal only — never expose gramjs-bridge / max-bridge / Evolution publicly
      GRAMJS_BRIDGE_URL: ${GRAMJS_BRIDGE_URL:-http://gramjs-bridge:3008}
      MAX_BRIDGE_URL: ${MAX_BRIDGE_URL:-http://max-bridge:3010}
      AI_WHATSAPP_WORKER_URL: ${AI_WHATSAPP_WORKER_URL:-http://ai-whatsapp-worker:3006}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      USD_RUB_RATE: ${USD_RUB_RATE:-90}
      AI_KNOWLEDGE_DIR: /voxly/data/ai-knowledge
    volumes:
      - ai-knowledge-data:/voxly/data/ai-knowledge
    labels:
      - "traefik.enable=true"
      # API on api.getvoxly.ru
      - "traefik.http.routers.saas-api.rule=Host(`api.getvoxly.ru`)"
      - "traefik.http.routers.saas-api.entrypoints=websecure"
      # - "traefik.http.routers.saas-api.tls.certresolver=le"
      - "traefik.http.routers.saas-api.service=saas-api"
      - "traefik.http.services.saas-api.loadbalancer.server.port=3002"
    networks:
      - voxly-net

  # --- SaaS Background Worker (BullMQ consumers + schedulers) ---
  saas-worker:
    build:
      context: ..
      dockerfile: apps/saas-api/Dockerfile
    restart: unless-stopped
    command: ["node", "apps/saas-api/dist/worker.js"]
    depends_on:
      postgres-control:
        condition: service_healthy
      postgres-twenty:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      VOXLY_DISABLE_WORKERS: "0"
      DATABASE_URL: postgresql://voxly:${POSTGRES_CONTROL_PASSWORD:-voxly_pass}@postgres-control:5432/voxly_control?schema=public
      REDIS_URL: redis://redis:6379
      TWENTY_API_URL: http://twenty-server:3000/graphql
      TWENTY_API_KEY: ${TWENTY_API_KEY}
      TWENTY_SERVER_URL: ${TWENTY_SERVER_URL:-https://app.getvoxly.ru}
      TWENTY_DATABASE_URL: postgresql://twenty:${POSTGRES_TWENTY_PASSWORD:-twenty_pass}@postgres-twenty:5432/twenty
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      ROBOKASSA_LOGIN: ${ROBOKASSA_LOGIN}
      ROBOKASSA_PASSWORD1: ${ROBOKASSA_PASSWORD1}
      ROBOKASSA_PASSWORD2: ${ROBOKASSA_PASSWORD2}
      ROBOKASSA_IS_TEST: ${ROBOKASSA_IS_TEST:-1}
      ROBOKASSA_HASH_ALG: ${ROBOKASSA_HASH_ALG:-sha256}
      TELEGRAM_MANAGER_BOT_TOKEN: ${TELEGRAM_MANAGER_BOT_TOKEN}
      TELEGRAM_MANAGER_BOT_USERNAME: ${TELEGRAM_MANAGER_BOT_USERNAME:-VoxlyGiftbot}
      PLATFORM_BOT_TOKEN: ${PLATFORM_BOT_TOKEN:-}
      PLATFORM_BOT_USERNAME: ${PLATFORM_BOT_USERNAME:-GetVoxlybot}
      VOXLY_DOMAIN: ${VOXLY_DOMAIN:-getvoxly.ru}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM:-}
      AI_MARKUP_PERCENT: ${AI_MARKUP_PERCENT:-50}
      AI_TOPUP_MIN_RUB: ${AI_TOPUP_MIN_RUB:-500}
      VOXLY_SERVICE_TOKEN: ${VOXLY_SERVICE_TOKEN:-}
      <<: *voxly-service-tokens
      VOXLY_CHAT_API_URL: ${VOXLY_CHAT_API_URL:-http://saas-api:3002}
      VOXLY_CRM_CHAT_TARBALL: ${VOXLY_CRM_CHAT_TARBALL:-/voxly/assets/voxly-crm-chat.tgz}
      GRAMJS_BRIDGE_URL: ${GRAMJS_BRIDGE_URL:-http://gramjs-bridge:3008}
      MAX_BRIDGE_URL: ${MAX_BRIDGE_URL:-http://max-bridge:3010}
      AI_WHATSAPP_WORKER_URL: ${AI_WHATSAPP_WORKER_URL:-http://ai-whatsapp-worker:3006}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      USD_RUB_RATE: ${USD_RUB_RATE:-90}
      AI_KNOWLEDGE_DIR: /voxly/data/ai-knowledge
    volumes:
      - ai-knowledge-data:/voxly/data/ai-knowledge
    networks:
      - voxly-net

  # --- SaaS Portal (Next.js — landing + client portals + admin) ---
  saas-portal:
    build:
      context: ..
      dockerfile: apps/saas-portal/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://api.getvoxly.ru
        NEXT_PUBLIC_VOXLY_DOMAIN: ${VOXLY_DOMAIN:-getvoxly.ru}
    restart: unless-stopped
    depends_on:
      - saas-api
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: https://api.getvoxly.ru
      NEXT_PUBLIC_VOXLY_DOMAIN: ${VOXLY_DOMAIN:-getvoxly.ru}
      VOXLY_DOMAIN: ${VOXLY_DOMAIN:-getvoxly.ru}
      SAAS_API_URL: http://saas-api:3002
    labels:
      - "traefik.enable=true"
      # Landing on getvoxly.ru (apex)
      - "traefik.http.routers.portal-landing.rule=Host(`getvoxly.ru`,`www.getvoxly.ru`)"
      - "traefik.http.routers.portal-landing.entrypoints=websecure"
      # - "traefik.http.routers.portal-landing.tls.certresolver=le"
      - "traefik.http.routers.portal-landing.service=saas-portal"
      # Client portals on {slug}.getvoxly.ru (catch-all, lower priority than twenty-wildcard)
      - "traefik.http.routers.portal-portals.rule=HostRegexp(`{slug:[a-z0-9-]+}.getvoxly.ru`)"
      - "traefik.http.routers.portal-portals.entrypoints=websecure"
      # - "traefik.http.routers.portal-portals.tls.certresolver=le"
      - "traefik.http.routers.portal-portals.service=saas-portal"
      # Set priority lower than twenty-wildcard so {slug}-crm wins
      - "traefik.http.routers.portal-portals.priority=10"
      - "traefik.http.routers.twenty-wildcard.priority=20"
      - "traefik.http.services.saas-portal.loadbalancer.server.port=3001"
    networks:
      - voxly-net

  # --- Platform Bot (@GetVoxlybot OTP + support) ---
  platform-bot-service:
    build:
      context: ..
      dockerfile: apps/platform-bot-service/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres-control:
        condition: service_healthy
      saas-api:
        condition: service_started
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://voxly:${POSTGRES_CONTROL_PASSWORD:-voxly_pass}@postgres-control:5432/voxly_control?schema=public
      PLATFORM_BOT_TOKEN: ${PLATFORM_BOT_TOKEN}
      PLATFORM_BOT_USERNAME: ${PLATFORM_BOT_USERNAME:-GetVoxlybot}
      PLATFORM_WEBHOOK_URL: https://api.getvoxly.ru/bots/platform/webhook
      PLATFORM_BOT_PORT: "3009"
      VOXLY_SERVICE_TOKEN: ${VOXLY_SERVICE_TOKEN:-}
      <<: *voxly-service-tokens
      SAAS_API_URL: http://saas-api:3002
      VOXLY_DOMAIN: ${VOXLY_DOMAIN:-getvoxly.ru}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.platform-bot.rule=Host(`api.getvoxly.ru`) && PathPrefix(`/bots/platform`)"
      - "traefik.http.routers.platform-bot.entrypoints=websecure"
      - "traefik.http.routers.platform-bot.service=platform-bot-service"
      - "traefik.http.services.platform-bot-service.loadbalancer.server.port=3009"
    networks:
      - voxly-net

  # --- Manager Bot Service (Telegram Managed Bots) ---
  manager-bot-service:
    build:
      context: ..
      dockerfile: apps/manager-bot-service/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres-control:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://voxly:${POSTGRES_CONTROL_PASSWORD:-voxly_pass}@postgres-control:5432/voxly_control?schema=public
      REDIS_URL: redis://redis:6379
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      TELEGRAM_MANAGER_BOT_TOKEN: ${TELEGRAM_MANAGER_BOT_TOKEN}
      TELEGRAM_MANAGER_BOT_USERNAME: ${TELEGRAM_MANAGER_BOT_USERNAME:-VoxlyGiftbot}
      MANAGER_WEBHOOK_URL: https://api.getvoxly.ru/bots/manager/webhook
      VOXLY_DOMAIN: ${VOXLY_DOMAIN:-getvoxly.ru}
      SAAS_API_URL: http://saas-api:3002
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.manager-bot.rule=Host(`api.getvoxly.ru`) && PathPrefix(`/bots/manager`)"
      - "traefik.http.routers.manager-bot.entrypoints=websecure"
      - "traefik.http.routers.manager-bot.service=manager-bot-service"
      - "traefik.http.services.manager-bot-service.loadbalancer.server.port=3003"
    networks:
      - voxly-net

  # --- Gift Bot Worker (gift delivery, funnels, broadcasts) ---
  gift-bot-worker:
    build:
      context: ..
      dockerfile: apps/gift-bot-worker/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres-control:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://voxly:${POSTGRES_CONTROL_PASSWORD:-voxly_pass}@postgres-control:5432/voxly_control?schema=public
      REDIS_URL: redis://redis:6379
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      TWENTY_API_URL: http://twenty-server:3000/graphql
      TWENTY_API_KEY: ${TWENTY_API_KEY}
      VOXLY_DOMAIN: ${VOXLY_DOMAIN:-getvoxly.ru}
      AI_TELEGRAM_WORKER_URL: ${AI_TELEGRAM_WORKER_URL:-http://ai-telegram-worker:3005}
      VOXLY_SERVICE_TOKEN: ${VOXLY_SERVICE_TOKEN:-}
      <<: *voxly-service-tokens
      SAAS_API_URL: ${SAAS_API_URL:-http://saas-api:3002}
      GRAMJS_BRIDGE_URL: ${GRAMJS_BRIDGE_URL:-http://gramjs-bridge:3008}
      AI_WHATSAPP_WORKER_URL: ${AI_WHATSAPP_WORKER_URL:-http://ai-whatsapp-worker:3006}
      # Same media understanding as AI workers (CRM ChatMessage enrichment; no sales LLM).
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      AI_CHAT_MODEL: ${AI_CHAT_MODEL:-google/gemini-2.5-flash}
      AI_ASR_MODEL: ${AI_ASR_MODEL:-openai/whisper-1}
      GIFT_BOT_WEBHOOK_BASE_URL: ${GIFT_BOT_WEBHOOK_BASE_URL:-}
      MAX_BOT_API_URL: ${MAX_BOT_API_URL:-https://platform-api2.max.ru}
    labels:
      - "traefik.enable=true"
      # Child bot webhooks: /tg/{tenantId}/{botId} (Telegram) + /max/... (MAX gift)
      - "traefik.http.routers.gift-bot.rule=Host(`api.getvoxly.ru`) && (PathPrefix(`/tg`) || PathPrefix(`/max`))"
      - "traefik.http.routers.gift-bot.entrypoints=websecure"
      - "traefik.http.routers.gift-bot.service=gift-bot-worker"
      - "traefik.http.services.gift-bot-worker.loadbalancer.server.port=3004"
      - "traefik.http.routers.gift-bot.priority=30"
    networks:
      - voxly-net

  # --- AI Telegram Worker (AI agent for Telegram) ---
  ai-telegram-worker:
    build:
      context: ..
      dockerfile: apps/ai-telegram-worker/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres-control:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://voxly:${POSTGRES_CONTROL_PASSWORD:-voxly_pass}@postgres-control:5432/voxly_control?schema=public
      REDIS_URL: redis://redis:6379
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      AI_CHAT_MODEL: ${AI_CHAT_MODEL:-google/gemini-2.5-flash}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-openai/text-embedding-3-small}
      AI_ASR_MODEL: ${AI_ASR_MODEL:-openai/whisper-1}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      TWENTY_API_URL: http://twenty-server:3000/graphql
      TWENTY_API_KEY: ${TWENTY_API_KEY}
      VOXLY_DOMAIN: ${VOXLY_DOMAIN:-getvoxly.ru}
      VOXLY_SERVICE_TOKEN: ${VOXLY_SERVICE_TOKEN:-}
      <<: *voxly-service-tokens
      SAAS_API_URL: ${SAAS_API_URL:-http://saas-api:3002}
      GRAMJS_BRIDGE_URL: ${GRAMJS_BRIDGE_URL:-http://gramjs-bridge:3008}
    networks:
      - voxly-net

  # --- GramJS bridge (personal TG account; optional profile) ---
  gramjs-bridge:
    profiles: ["gramjs"]
    build:
      context: ..
      dockerfile: apps/gramjs-bridge/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres-control:
        condition: service_healthy
      ai-telegram-worker:
        condition: service_started
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://voxly:${POSTGRES_CONTROL_PASSWORD:-voxly_pass}@postgres-control:5432/voxly_control?schema=public
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      VOXLY_SERVICE_TOKEN: ${VOXLY_SERVICE_TOKEN:-}
      <<: *voxly-service-tokens
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      TELEGRAM_PHONE: ${TELEGRAM_PHONE:-}
      AI_TELEGRAM_WORKER_URL: ${AI_TELEGRAM_WORKER_URL:-http://ai-telegram-worker:3005}
      GRAMJS_BRIDGE_PORT: 3008
    networks:
      - voxly-net

  # --- MAX bridge (personal MAX account via PyMax; optional profile) ---
  max-bridge:
    profiles: ["max"]
    build:
      context: ..
      dockerfile: apps/max-bridge/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres-control:
        condition: service_healthy
      saas-api:
        condition: service_started
    environment:
      VOXLY_SERVICE_TOKEN: ${VOXLY_SERVICE_TOKEN:-}
      <<: *voxly-service-tokens
      SAAS_API_URL: ${SAAS_API_URL:-http://saas-api:3002}
      MAX_BRIDGE_PORT: 3010
      MAX_SESSION_DIR: /data/max-sessions
    volumes:
      - max-sessions-data:/data/max-sessions
    networks:
      - voxly-net

  # --- Evolution API (WhatsApp Baileys; profile whatsapp) ---
  evolution-api:
    profiles: ["whatsapp"]
    # ≥2.3.7 for LID→E.164 (remoteJidAlt). Dockerfile re-applies PR #2544 @lid bypass if needed.
    image: voxly-evolution-api:v2.3.7-lid
    build:
      context: ..
      dockerfile: docker/evolution-api.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres-control:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SERVER_URL: ${EVOLUTION_SERVER_URL:-http://evolution-api:8080}
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "true"
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://voxly:${POSTGRES_CONTROL_PASSWORD:-voxly_pass}@postgres-control:5432/evolution
      DATABASE_CONNECTION_CLIENT_NAME: evolution_voxly
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/6
      CACHE_REDIS_PREFIX_KEY: evolution
      LOG_LEVEL: ERROR,WARN,INFO
      DEL_INSTANCE: "false"
      CONFIG_SESSION_PHONE_CLIENT: Voxly
      CONFIG_SESSION_PHONE_NAME: Chrome
      # WhatsApp Web version for Baileys QR. Stale defaults (e.g. 2.3000.1015901307)
      # return qrcode:{count:0} forever — bump when WA blocks QR (wppconnect versions).
      CONFIG_SESSION_PHONE_VERSION: ${CONFIG_SESSION_PHONE_VERSION:-2.3000.1043705293}
      QRCODE_LIMIT: 30
    volumes:
      - evolution-instances:/evolution/instances
    networks:
      - voxly-net

  # --- AI WhatsApp Worker (Evolution channel → CRM / optional AI) ---
  ai-whatsapp-worker:
    build:
      context: ..
      dockerfile: apps/ai-whatsapp-worker/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres-control:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://voxly:${POSTGRES_CONTROL_PASSWORD:-voxly_pass}@postgres-control:5432/voxly_control?schema=public
      REDIS_URL: redis://redis:6379
      # Baileys lidMapping hash lives in Evolution Redis DB 6.
      EVOLUTION_REDIS_URI: redis://redis:6379/6
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      TWENTY_API_URL: http://twenty-server:3000/graphql
      VOXLY_DOMAIN: ${VOXLY_DOMAIN:-getvoxly.ru}
      VOXLY_SERVICE_TOKEN: ${VOXLY_SERVICE_TOKEN:-}
      <<: *voxly-service-tokens
      EVOLUTION_API_URL: ${EVOLUTION_API_URL:-http://evolution-api:8080}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-}
      AI_WHATSAPP_WEBHOOK_URL: ${AI_WHATSAPP_WEBHOOK_URL:-http://ai-whatsapp-worker:3006/webhook/evolution}
      AI_WHATSAPP_PORT: 3006
      GRAMJS_BRIDGE_URL: ${GRAMJS_BRIDGE_URL:-http://gramjs-bridge:3008}
      # Free soft-deleted Person emails that block unique (INC-062)
      TWENTY_DATABASE_URL: postgresql://twenty:${POSTGRES_TWENTY_PASSWORD:-twenty_pass}@postgres-twenty:5432/twenty
    networks:
      - voxly-net

volumes:
  traefik-letsencrypt:
  postgres-control-data:
  postgres-twenty-data:
  redis-data:
  twenty-storage:
  evolution-instances:
  ai-knowledge-data:
  max-sessions-data:

networks:
  voxly-net:
    driver: bridge
